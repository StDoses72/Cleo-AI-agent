name: Desktop platforms

on:
  pull_request:
    paths-ignore:
      - 'download/**'
      - '.github/workflows/download-page.yml'
      - 'README.md'
      - 'README.en.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: macos-14
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x64
          - os: ubuntu-24.04
            target: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Seed test-only configuration
        shell: bash
        run: |
          mkdir -p config
          cp cleo/config/templates/cleo.example.json config/cleo.json
          cp cleo/config/templates/harnesses.example.json config/harnesses.json
      - run: uv pip install --system -e ".[dev]"
      - run: npm ci --prefix ui
      - run: ruff check cleo tests scripts/build-release.py
      - run: pytest -q
      - run: npm --prefix ui run test:backend
      - run: npm --prefix ui run build
      - name: Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0t64 libnss3 libgbm1 libasound2t64
          sudo chown root:root ui/node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 ui/node_modules/electron/dist/chrome-sandbox
      - name: Desktop smoke
        if: runner.os != 'Linux'
        run: node ui/scripts/smoke.mjs
      - name: Linux desktop smoke
        if: runner.os == 'Linux'
        run: xvfb-run -a node ui/scripts/smoke.mjs
      - name: Windows update smoke
        if: runner.os == 'Windows'
        env:
          CLEO_PYTHON: ${{ steps.python.outputs.python-path }}
        run: node ui/scripts/smoke-update.mjs
      - name: Build native POSIX package
        if: runner.os != 'Windows'
        run: npm --prefix ui run package:portable
      - name: Build native Windows package
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch'
        run: ./scripts/build-release.ps1 -ElectronMirror '' -PythonIndex 'https://pypi.org/simple/'
      - name: Native packaged smoke
        if: runner.os == 'macOS' || (runner.os == 'Windows' && github.event_name == 'workflow_dispatch')
        run: npm --prefix ui run smoke:packaged
      - name: Linux installed package smoke
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./release/Cleo-linux-x64.deb
          CLEO_EXECUTABLE=/opt/Cleo/Cleo xvfb-run -a npm --prefix ui run smoke:packaged
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-${{ matrix.target }}
          if-no-files-found: ignore
          path: |
            ui/output/playwright/
            release/*.zip
            release/*.tar.gz
            release/*.deb
            release/*.sha256
            release/release*.json
