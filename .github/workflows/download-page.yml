name: Download page

on:
  pull_request:
    paths:
      - 'download/**'
      - '.github/workflows/download-page.yml'
      - 'ui/public/cleo.png'
  push:
    branches: [main]
    paths:
      - 'download/**'
      - '.github/workflows/download-page.yml'
      - 'ui/public/cleo.png'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: download-page-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, macos-15-intel, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test download/tests/targets.test.mjs
      - run: python -m unittest discover -s download/tests -p test_scripts.py -v
      - name: Install browser test dependencies
        if: runner.os == 'Linux'
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          npm ci --prefix ui
          cd ui
          npx playwright install --with-deps chromium
      - name: Browser checks
        if: runner.os == 'Linux'
        run: node download/tests/browser.mjs

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage public download files
        run: |
          mkdir -p "$RUNNER_TEMP/cleo-download-page"
          cp download/site/* "$RUNNER_TEMP/cleo-download-page/"
          cp ui/public/cleo.png "$RUNNER_TEMP/cleo-download-page/cleo.png"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/cleo-download-page
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
