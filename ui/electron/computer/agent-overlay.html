<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font: 12px system-ui, "Microsoft YaHei", sans-serif; }
  /* The browser view while the agent drives it: a thin frame and a small flat label (click to take over). */
  [data-surface] { position: fixed; inset: 0; cursor: pointer; box-shadow: inset 0 0 0 2px rgba(62, 170, 255, .55); }
  .chip { position: fixed; right: 10px; bottom: 10px; padding: 5px 10px; border: 1px solid rgba(255, 255, 255, .14); border-radius: 6px; color: #fff; background: rgba(31, 31, 34, .88); }
  .dot { display: inline-block; width: 7px; height: 7px; margin-right: 6px; border-radius: 50%; background: #3eaaff; vertical-align: 1px; }
</style>
</head>
<body>
  <div data-surface title="点击接管浏览器"><span class="chip"><span class="dot"></span><span data-browser-label>AI 正在操作浏览器 · 点击接管</span></span></div>
</body>
</html>
