<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font: 13px system-ui, "Microsoft YaHei", sans-serif; user-select: none; }
  .bar { box-sizing: border-box; height: 40px; margin: 3px; display: flex; align-items: center; gap: 10px; padding: 0 8px 0 12px;
    border-radius: 10px; color: #fff; background: rgba(160, 30, 30, .92); box-shadow: 0 2px 10px rgba(0,0,0,.35); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #fff; flex: none; }
  [data-label] { font-weight: 600; white-space: nowrap; }
  [data-shortcut] { opacity: .85; white-space: nowrap; font-size: 12px; flex: 1; }
  button { border: 0; border-radius: 7px; padding: 5px 10px; font: inherit; cursor: pointer; color: #1a1a1a; background: #fff; }
  button.stop { background: #ffd24d; font-weight: 700; }
  [hidden] { display: none; }
</style>
</head>
<body>
  <div class="bar" role="status">
    <span class="dot"></span><span data-label>Cleo 正在控制本机鼠标键盘</span><span data-shortcut></span>
    <button type="button" data-action="takeover-desktop">接管</button>
    <button type="button" data-action="handback-desktop" hidden>交回 AI</button>
    <button type="button" class="stop" data-action="stop">停止</button>
  </div>
</body>
</html>
