<!doctype html><html lang="zh-CN"><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; connect-src 'self'">
<title data-i18n="evolution_monitor.cleo_evolution_companion">Cleo · 进化伴随窗口</title><link rel="stylesheet" href="evolution-monitor.css">
<header><div class="brand"><b aria-hidden="true"><svg viewBox="0 0 1024 1024" width="18" height="18"><path d="M701.5 322.5A268 268 0 1 0 701.5 701.5" fill="none" stroke="currentColor" stroke-width="120" stroke-linecap="round"/><circle cx="712" cy="512" r="68" fill="currentColor"/></svg></b><span><span data-i18n="app.evolution">进化</span></span></div><div class="header-actions"><button id="check" class="quiet" title="检查并构建本轮改动" data-i18n-title="evolution_monitor_renderer.check_and_build_this_iteration_s_changes"><span data-i18n="evolutionpanel.check_changes">检查改动</span></button><button id="apply" class="primary" hidden><span data-i18n="evolutionpanel.apply">应用</span></button><button id="save" class="primary" hidden><span data-i18n="monitor.saveVersion">保存版本</span></button><button id="recovery" class="quiet"><span data-i18n="monitor.versions">版本与恢复</span></button></div></header>
<form id="save-form" class="save-form" hidden><label for="version-name"><span data-i18n="evolution_monitor_renderer.version_name">版本名称</span></label><input id="version-name" maxlength="80" autocomplete="off"><button type="submit" class="primary"><span data-i18n="computerpanel.save">保存</span></button><button type="button" id="save-cancel" class="quiet"><span data-i18n="computerpanel.cancel">取消</span></button></form>
<section class="status"><span id="light"></span><div><strong id="phase" role="status"><span data-i18n="monitor.connecting">连接中…</span></strong><p id="detail"></p></div></section>
<main id="conversation" aria-label="进化对话" data-i18n-aria-label="monitor.conversation"><div id="timeline"></div><div id="messages"></div><div id="questions"></div></main>
<section class="diagnostics"><details><summary><span data-i18n="monitor.logs">构建与重启日志</span></summary><pre id="logs"></pre><button id="emergency" class="quiet" type="button"><span data-i18n="monitor.emergency">主程序无响应？打开独立恢复入口</span></button></details><p id="control-status" role="status"></p><p id="error" role="alert"></p></section>
<footer><div class="controls"><button id="stop" class="quiet"><span data-i18n="monitor.stop">■ 停止执行</span></button><button id="resume" class="quiet" hidden><span data-i18n="monitor.resume">继续处理消息</span></button><button id="discard" class="danger"><span data-i18n="evolution_monitor.discard_this_iteration_s_changes">放弃本轮改动</span></button></div>
<form id="form"><label class="sr-only" for="body"><span data-i18n="evolutionpreparation.additional_requirements">补充需求</span></label><textarea id="body" maxlength="30000" placeholder="告诉 Cleo 还想怎么改…" data-i18n-placeholder="monitor.placeholder" rows="2"></textarea><button id="send" title="发送补充需求" data-i18n-title="monitor.send" aria-label="发送补充需求" data-i18n-aria-label="monitor.send">↑</button></form><p id="hint"></p></footer>
<script type="module" src="evolution-monitor-renderer.js"></script></html>
